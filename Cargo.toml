[package]
name = "matcher"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "High-performance trading order matching engine"
license = "Apache-2.0"
repository = "https://github.com/yourusername/matcher"
keywords = ["trading", "matching-engine", "finance", "high-frequency"]
categories = ["finance", "network-programming"]

[dependencies]
# Async runtime
tokio = { version = "1.47", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Network
socket2 = "0.5"
bytes = "1.5"

# Utilities
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Metrics and monitoring
prometheus = "0.13"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Performance optimization (from matching-core)
ahash = { version = "0.8", features = ["serde"] }
smallvec = { version = "1.13", features = ["serde"] }
slab = { version = "0.4", features = ["serde"] }

# Performance
crossbeam = "0.8"
parking_lot = "0.12"

# Command line parsing
structopt = "0.3"
num_cpus = "1.0"
bincode = "1.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tokio-test = "0.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"
proptest = "1.0"
tempfile = "3.0"
serial_test = "3.0"

[[bench]]
name = "matching_benchmark"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
debug = true
