[package]
name = "matcher"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Single-product trading matching engine over UDP multicast"

[features]
fuzzing = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "io-util", "time"] }
socket2 = "0.5"
ahash = "0.8"
smallvec = "1.13"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "order_book"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
